<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h2>Date, Math, Array 객체 알아보기</h2>
    <script>
      //날짜 생성
      //   const today = new Date();
      //   console.log(today);

      const today = new Date(2025, 9, 3, 14, 2, 30);
      console.log(today);
      console.log(today.getFullYear());
      console.log(today.getMonth());
      console.log(today.toLocaleString());

      //난수 발생 /////////////////
      let no = Math.random() * 5 + 1; //0.0 ~ 0.9999
      console.log(no);

      /////배열///////////////////////
      const arr1 = [];
      const arr2 = new Array(1, true, "졸립다");
      const arr3 = [2, 4, 6, 8, true];

      const arr4 = [
        [1, 2, 3],
        [3, 6, 8, 12],
        ["A", "B"],
        [true, false, 3.14],
      ];

      const arr5 = [
        { name: "준화", age: 24 },
        { name: "규태", age: 23 },
        { name: "재윤", age: 22 },
      ];
      console.log("===============");
      console.log(arr1.length);
      console.log(arr2.length);
      console.log(arr3.length);
      console.log(arr4.length);
      console.log(arr5.length);
    </script>
  </body>
</html>
