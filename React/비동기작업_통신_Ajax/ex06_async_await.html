<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>async와 await 사용하기 - 하나 둘 셋</h1>
    <script>
      const taskA = () => {
        return new Promise((resolve, reject) => {
          setTimeout(() => {
            resolve("하나");
          }, 2000);
        });
      };

      const taskB = (param) => {
        console.log("taskA의 결과를 taskB에서 .." + param);
        return new Promise((resolve, reject) => {
          setTimeout(() => {
            resolve("둘");
          }, 1000);
        });
      };

      const taskC = () => {
        return new Promise((resolve, reject) => {
          setTimeout(() => {
            resolve("셋");
          }, 1500);
        });
      };

      //
      const test = async () => {
        try {
          let resultA = await taskA(); //호출
          console.log("resultA = " + resultA);

          let resultB = await taskB(); //호출
          console.log("resultB = " + resultB);

          let resultC = await taskC(); //호출
          console.log("resultC = " + resultC);
        } catch (err) {
          console.log(err);
        } finally {
          console.log("난 무조건 실행되어요");
        }
      };

      const t = test();
      console.log(t);

      console.log("--끝 --");
    </script>
  </body>
</html>
